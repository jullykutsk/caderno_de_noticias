name: Atualizar Caderno de Noticias (Dia e Noite)

on:
  schedule:
    - cron: "0 10 * * *"  # ~07:00 BRT (Edição do Dia)
    - cron: "0 22 * * *"  # ~19:00 BRT (Edição da Noite)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  atualizar-edicoes:
    runs-on: ubuntu-latest
    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar dados/edicoes.json
        run: python scripts/atualizar_jornal.py

      - name: Publicar alterações no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/edicoes.json
          git diff --staged --quiet || git commit -m "chore: atualiza edicoes do caderno de noticias"
          git push
